<!-- Tag imod to tal fra brugeren, og derefter skriv differensen på disse tal i console.log -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let førsteTal = Number(prompt("Skriv et tal"));
      let andetTal = Number(prompt("Skriv et tal"));

      let resultat =
        førsteTal > andetTal ? førsteTal - andetTal : andetTal - førsteTal;
      console.log("resultat:", resultat);
    </script>
  </body>
</html>
