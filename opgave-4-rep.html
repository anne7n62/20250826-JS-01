<!-- Tag imod et tekstinput fra brugeren. Antag at teksten er deres navn 
og skriv en hilsen ud i konsollen ved at konkatenere (sammensætte) navnet med hilseudtrykket.
Udvid programmet til også at tage imod efternavn, og inkluder også det i hilsenen. -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let fornavn = prompt("Skriv dit fornavn");
      let efternavn = prompt("Skriv dit efternavn");

      console.log("hej" + " " + fornavn + " " + efternavn);
    </script>
  </body>
</html>
