<!-- Tag imod et tal fra brugeren, og derefter skriv i konsollen om tallet er lige
eller ulige Brug ternary ? -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let tal = Number(prompt("Skriv et tal"));

      let resultat = tal % 2 == 0 ? "lige" : "ulige";
      console.log(tal % 2 == 0);
      console.log("resultat:", resultat);
    </script>
  </body>
</html>
